{% extends "layout.html" %}

{% block body %}
<style>
    .chat-box {
        background: white;
        border-radius: 16px;
        padding: 16px;
        min-height: 340px;
        max-height: 50vh;
        overflow-y: auto;
        margin-bottom: 16px;
    }
    .message {
        margin-bottom: 14px;
        line-height: 1.4;
    }
    .message.user {
        text-align: right;
    }
    .message.user span {
        background: #C4A574;
        color: white;
        padding: 10px 14px;
        border-radius: 16px 16px 4px 16px;
        display: inline-block;
    }
    .message.assistant span {
        background: #F0E6D8;
        padding: 10px 14px;
        border-radius: 16px 16px 16px 4px;
        display: inline-block;
    }
    form {
        display: flex;
        gap: 8px;
    }
    input {
        flex: 1;
        padding: 14px;
        border-radius: 12px;
        border: 1px solid #ddd;
        font-size: 16px;
    }
    button {
        padding: 14px 18px;
        border-radius: 12px;
        background: #C4A574;
        color: white;
        border: none;
        font-weight: 600;
    }
</style>

<p><a href="/">← Назад</a></p>
<h2>Бибинтосик</h2>

<div class="chat-box">
    {% for msg in messages %}
        <div class="message {{ msg.role }}">
            <span>{{ msg.content }}</span>
        </div>
    {% endfor %}
</div>

<form action="/chat" method="post">
    <input type="text" name="message" placeholder="Напиши Бибинтосику..." required autocomplete="off">
    <button type="submit">➤</button>
</form>
{% endblock %}
