{% extends "layout.html" %}

{% block body %}
<style>
    .member {
        background: white;
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 12px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .member strong {
        font-size: 17px;
    }
    .relation {
        color: #7A6A58;
        font-size: 14px;
        margin-top: 2px;
    }
    .notes {
        margin-top: 8px;
        font-size: 15px;
    }
    input, textarea {
        width: 100%;
        padding: 13px;
        border-radius: 12px;
        border: 1px solid #ddd;
        font-size: 16px;
        margin-bottom: 10px;
    }
    textarea {
        height: 70px;
        resize: none;
    }
    button {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        background: #C4A574;
        color: white;
        border: none;
        font-weight: 600;
    }
    .delete {
        float: right;
        color: #C4A574;
        font-size: 13px;
    }
</style>

<p><a href="/">← Назад</a></p>
<h2>Семья</h2>

<form action="/family" method="post">
    <input type="text" name="name" placeholder="Имя" required>
    <input type="text" name="relation" placeholder="Кем приходится (мама, сестра, друг...)">
    <textarea name="notes" placeholder="Что важно помнить о человеке"></textarea>
    <button type="submit">Добавить</button>
</form>

<br>

{% for m in members %}
    <div class="member">
        <a class="delete" href="/family/delete/{{ m.id }}">удалить</a>
        <strong>{{ m.name }}</strong>
        <div class="relation">{{ m.relation or '—' }}</div>
        {% if m.notes %}
            <div class="notes">{{ m.notes }}</div>
        {% endif %}
    </div>
{% else %}
    <p style="color:#999; text-align:center; margin-top:30px;">Пока никого нет</p>
{% endfor %}
{% endblock %}
