{% extends "layout.html" %}

{% block body %}
<style>
    .member {
        background: white;
        border-radius: 16px;
        padding: 16px;
        margin-bottom: 14px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .member strong {
        font-size: 18px;
    }
    .relation {
        color: #7A6A58;
        font-size: 14px;
        margin-top: 2px;
    }
    .notes {
        margin-top: 8px;
        font-size: 15px;
        color: #555;
    }
    .actions {
        margin-top: 14px;
        display: flex;
        gap: 8px;
    }
    .actions a {
        flex: 1;
        text-align: center;
        background: #F7F3ED;
        padding: 10px;
        border-radius: 10px;
        font-size: 14px;
        color: #3E3226;
        font-weight: 500;
    }
    .delete {
        float: right;
        color: #C4A574;
        font-size: 13px;
    }
</style>

<a class="back" href="/">← Назад</a>
<h2>Семья</h2>

<form action="/family" method="post" style="margin-bottom: 24px;">
    <input type="text" name="name" placeholder="Имя" required>
    <input type="text" name="relation" placeholder="Кем приходится">
    <textarea name="notes" placeholder="Что важно помнить о человеке" style="height: 70px;"></textarea>
    <button type="submit">Добавить</button>
</form>

{% for m in members %}
    <div class="member">
        <a class="delete" href="/family/delete/{{ m.id }}">удалить</a>
        <strong>{{ m.name }}</strong>
        <div class="relation">{{ m.relation or '—' }}</div>
        {% if m.notes %}
            <div class="notes">{{ m.notes }}</div>
        {% endif %}

        <div class="actions">
            <a href="/family/suggest/{{ m.id }}?type=message">Что написать</a>
            <a href="/family/suggest/{{ m.id }}?type=gift">Что подарить</a>
        </div>
    </div>
{% else %}
    <p style="color:#999; text-align:center; margin-top:40px;">Пока никого нет</p>
{% endfor %}
{% endblock %}
