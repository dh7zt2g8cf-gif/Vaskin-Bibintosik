{% extends "layout.html" %}

{% block body %}
<style>
    .note {
        background: white;
        border-radius: 14px;
        padding: 14px 16px;
        margin-bottom: 10px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        position: relative;
    }
    .note small {
        color: #999;
        font-size: 12px;
    }
    .delete {
        color: #C4A574;
        font-size: 13px;
        float: right;
    }
    textarea {
        width: 100%;
        height: 90px;
        padding: 14px;
        border-radius: 12px;
        border: 1px solid #ddd;
        font-size: 16px;
        resize: none;
        margin-bottom: 10px;
    }
    button {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        background: #C4A574;
        color: white;
        border: none;
        font-weight: 600;
        font-size: 16px;
    }
</style>

<p><a href="/">← Назад</a></p>
<h2>Заметки</h2>

<form action="/notes" method="post">
    <textarea name="content" placeholder="Что записать?" required></textarea>
    <button type="submit">Сохранить</button>
</form>

<br>

{% for note in notes %}
    <div class="note">
        <a class="delete" href="/notes/delete/{{ note.id }}">удалить</a>
        {{ note.content }}
        <br>
        <small>{{ note.created_at }}</small>
    </div>
{% else %}
    <p style="color:#999; text-align:center; margin-top:30px;">Пока заметок нет</p>
{% endfor %}
{% endblock %}
