{% extends "layout.html" %}

{% block body %}
<style>
    .character {
        text-align: center;
        margin: 30px 0;
    }
    .character img {
        width: 220px;
        border-radius: 50%;
        background: #EDE4D7;
        padding: 10px;
    }
    .greeting {
        text-align: center;
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 8px;
    }
    .subtitle {
        text-align: center;
        color: #7A6A58;
        margin-bottom: 30px;
    }
    .menu {
        display: grid;
        gap: 12px;
    }
    .menu a {
        display: block;
        background: #FFFFFF;
        padding: 18px;
        border-radius: 16px;
        text-decoration: none;
        color: #3E3226;
        font-weight: 500;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        text-align: center;
    }
</style>

<div class="character">
    <!-- Сюда потом поставим картинку Бибинтосика -->
    <div style="width:220px; height:220px; background:#EDE4D7; border-radius:50%; margin:0 auto; display:flex; align-items:center; justify-content:center; font-size:60px;">
        🐾
    </div>
</div>

<div class="greeting">Привет! Я Бибинтосик</div>
<div class="subtitle">Твой добрый помощник</div>

<div class="menu">
    <a href="/chat">Поговорить со мной</a>
    <a href="/reminders">Напоминания</a>
    <a href="/notes">Заметки</a>
    <a href="/family">Семья</a>
    <a href="/tasks">Задачи</a>
</div>
{% endblock %}
