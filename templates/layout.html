<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Васькин Бибинтосик</title>
    <style>
        :root {
            --bg: #F7F3ED;
            --card: #FFFFFF;
            --text: #3E3226;
            --text-secondary: #7A6A58;
            --accent: #C4A574;
            --accent-dark: #A88B5E;
            --border: #E8DFD3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.45;
            min-height: 100vh;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        h1, h2 {
            font-weight: 700;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        input, textarea, select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            font-size: 16px;
            background: white;
            margin-bottom: 10px;
            color: var(--text);
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        button, .btn {
            display: inline-block;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            background: var(--accent);
            color: white;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        button:active {
            background: var(--accent-dark);
        }

        .back {
            display: inline-block;
            margin-bottom: 16px;
            color: var(--text-secondary);
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        {% block body %}{% endblock %}
    </div>
</body>
</html>
