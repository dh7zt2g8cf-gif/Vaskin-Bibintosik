{% extends "layout.html" %}

{% block body %}
<style>
    .task {
        background: white;
        border-radius: 14px;
        padding: 14px 16px;
        margin-bottom: 10px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .task.done {
        opacity: 0.5;
        text-decoration: line-through;
    }
    input {
        width: 100%;
        padding: 13px;
        border-radius: 12px;
        border: 1px solid #ddd;
        font-size: 16px;
        margin-bottom: 10px;
    }
    button {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        background: #C4A574;
        color: white;
        border: none;
        font-weight: 600;
    }
    .actions a {
        color: #C4A574;
        font-size: 13px;
        margin-left: 12px;
    }
</style>

<p><a href="/">← Назад</a></p>
<h2>Задачи</h2>

<form action="/tasks" method="post">
    <input type="text" name="title" placeholder="Новая задача..." required>
    <button type="submit">Добавить</button>
</form>

<br>

{% for task in tasks %}
    <div class="task {% if task.is_done %}done{% endif %}">
        <div>{{ task.title }}</div>
        <div class="actions">
            {% if not task.is_done %}
                <a href="/tasks/done/{{ task.id }}">✓</a>
            {% endif %}
            <a href="/tasks/delete/{{ task.id }}">✕</a>
        </div>
    </div>
{% else %}
    <p style="color:#999; text-align:center; margin-top:30px;">Задач пока нет</p>
{% endfor %}
{% endblock %}
